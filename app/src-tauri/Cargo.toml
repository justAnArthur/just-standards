[package]
name = "app-standards"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
app-core = { path = "../../../../crates/app-core" }
claude-code = { path = "../../../../crates/claude-code" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
# `generate_context!` expands a `plugins` config section into `serde_json` calls.
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
# Listed here as well as in app-core: cargo hands a plugin's `links` metadata (its permission files) only to
# direct dependents, and tauri-build needs it to resolve the capabilities.
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
