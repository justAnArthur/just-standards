# build-macos-on-tag.yml
# ---
# builds Standards for a release tag (`just-standards-app@x.y.z`) and attaches the zipped app to that
# tag's GitHub release (created by release-on-tag.yml from the same tag).
#
# this repo holds the engine (core/, cli/, packs/) and the desktop app in app/; only the app is
# released. its tag is named after app/package.json (`just-standards-app`), so engine tags never
# start this workflow.
#
# the app builds only inside the just-apps platform (workspace packages, crates/app-core), so this
# checks out just-apps and puts this repo at apps/standards; the platform CLI finds the app in
# apps/standards/app. the PLATFORM_TOKEN secret is a fine-grained token with read access to the
# just-apps repo.
#
# bump-version.yml dispatches this workflow for every new tag that matches `push.tags`, passing the
# tag as the `tag` input — keep that input.
#
# the app is ad-hoc signed, not notarized: first launch needs right-click → Open, or
# `xattr -dr com.apple.quarantine "Standards.app"`.
# ---
name: build-macos-on-tag
run-name: "macOS app — ${{ inputs.tag || github.ref_name }}"

on:
  push:
    tags: [ "just-standards-app@*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (e.g. "just-standards-app@0.2.0")'
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/just-apps
          token: ${{ secrets.PLATFORM_TOKEN }}
          # the install scripts that run later have no use for the token
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          path: apps/standards

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # inline, not a file in this repo: the app is checked out at the tag, which may predate the script
      - name: Keep the workspaces that are here
        run: |
          cat > "$RUNNER_TEMP/trim-workspaces.ts" <<'EOF'
            // Only this app is checked out: the other apps are empty submodule folders, which neither bun nor cargo can load.
            import { existsSync } from 'node:fs'

            const manifest = await Bun.file('package.json').json()
            manifest.workspaces = manifest.workspaces.filter((w: string) => w.includes('*') || existsSync(`${w}/package.json`))
            await Bun.write('package.json', JSON.stringify(manifest, null, 2))

            const cargo = await Bun.file('Cargo.toml').text()
            const members = [...(cargo.match(/members = \[([^\]]*)\]/)?.[1] ?? '').matchAll(/"([^"]+)"/g)].map(m => m[1] as string)
            const kept = members.filter(m => [...new Bun.Glob(`${m}/Cargo.toml`).scanSync('.')].length > 0)
            await Bun.write('Cargo.toml', cargo.replace(/members = \[[^\]]*\]/, `members = [${kept.map(m => JSON.stringify(m)).join(', ')}]`))
            console.log(`workspaces: ${manifest.workspaces.join(', ')}; cargo members: ${kept.join(', ')}`)
          EOF
          bun "$RUNNER_TEMP/trim-workspaces.ts"

      - run: bun install

      - name: Build the app
        env:
          # signs the updater's bundle; its public key is `updater.pubkey` in app/app.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        run: bun run app build standards --target universal-apple-darwin --bundles app

      - name: Package
        id: pkg
        run: |
          version="${TAG#just-standards-app@}"
          dir="target/universal-apple-darwin/release/bundle/macos"
          # Standards.zip is the stable link (releases/latest/download/Standards.zip); the versioned one stays with its release.
          zip="just-standards-app-$version.zip"
          ditto -c -k --sequesterRsrc --keepParent "$dir/Standards.app" "$zip"
          cp "$zip" Standards.zip
          # self-update: installed apps read releases/latest/download/latest.json, which points at this signed bundle
          cp "$dir/Standards.app.tar.gz" Standards.app.tar.gz
          url="https://github.com/${{ github.repository }}/releases/download/${TAG/@/%40}/Standards.app.tar.gz"
          # one universal bundle serves both architectures
          jq -n --arg v "$version" --arg sig "$(cat "$dir/Standards.app.tar.gz.sig")" --arg url "$url" \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $v, pub_date: $date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' > latest.json
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the working directory is the just-apps checkout; the release belongs to this repo.
          GH_REPO: ${{ github.repository }}
        run: |
          # release-on-tag.yml creates the release from the same tag, possibly after this build starts.
          for _ in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 10; done
          gh release upload "$TAG" "${{ steps.pkg.outputs.zip }}" Standards.zip Standards.app.tar.gz latest.json --clobber
