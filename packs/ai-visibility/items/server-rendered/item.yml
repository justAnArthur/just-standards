id: server-rendered
version: 1
title: The content is in the HTML as served
label: server-rendered
why: most AI crawlers run no JavaScript; a page that arrives as an empty app shell is blank to them, and slow to index for search engines
applies_to: [website]
category: ai
severity: must
owner_role: engineering
sources:
  - title: 'Google Search Central: Understand JavaScript SEO basics'
    url: 'https://developers.google.com/search/docs/crawling-indexing/javascript/javascript-seo-basics'
  - title: 'web.dev: Rendering on the Web'
    url: 'https://web.dev/articles/rendering-on-the-web'
check:
  kind: script
