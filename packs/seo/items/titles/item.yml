id: titles
version: 1
title: Every page has its own title
label: titles
why: the title is the blue link in search results and the name an AI answer gives a page; a missing, duplicated or cut-off title loses the click
applies_to: [website]
category: seo
severity: must
owner_role: seo
sources:
  - title: 'Google Search Central: Influencing your title links in search results'
    url: 'https://developers.google.com/search/docs/appearance/title-link'
check:
  kind: crawl
  expect:
    # `head > title`: an inline SVG's <title> is an icon's name, not the page's
    - select: head > title
      min_length: 10
      max_length: 70
      unique: true
