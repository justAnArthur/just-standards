id: image-alt
version: 1
title: Images have alt text
label: image alt
why: alt text is what a screen reader says and what image search and AI read instead of the picture; an image without it is a blank to all three
applies_to: [website]
# accessibility rather than seo: alt text is WCAG 1.1.1 and an EAA obligation first; image search is the side effect
category: accessibility
severity: should
owner_role: seo
sources:
  - title: 'W3C: Understanding WCAG 2.2 SC 1.1.1 Non-text Content'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html'
  - title: 'Google Search Central: Google image SEO best practices (descriptive alt text)'
    url: 'https://developers.google.com/search/docs/appearance/google-images'
check:
  kind: script
