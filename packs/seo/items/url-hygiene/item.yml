id: url-hygiene
version: 1
title: Sitemap URLs are clean and consistent
label: url hygiene
why: mixed case, two trailing-slash styles and query strings make several URLs of one page, which split its ranking and waste crawls
applies_to: [website]
category: seo
severity: nice
owner_role: seo
sources:
  - title: 'Google Search Central: URL structure best practices for Google'
    url: 'https://developers.google.com/search/docs/crawling-indexing/url-structure'
  - title: 'Google Search Central: How to specify a canonical URL'
    url: 'https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls'
check:
  kind: script
