id: canonical-host
version: 1
title: One canonical host, the others redirect to it
label: canonical host
why: a site that answers on both www and the bare domain, or on http://, splits its ranking and its share counts between copies; a missing www record loses everyone who types it
applies_to: [website]
category: seo
severity: must
preview: false
owner_role: engineering
sources:
  - title: 'Google Search Central: How to specify a canonical URL (redirects)'
    url: 'https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls'
  - title: 'Google Search Central: Redirects and Google Search'
    url: 'https://developers.google.com/search/docs/crawling-indexing/301-redirects'
  - title: 'HSTS Preload List: submission requirements (redirect to HTTPS on the same host first)'
    url: 'https://hstspreload.org/'
check:
  kind: script
