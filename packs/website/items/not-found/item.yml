id: not-found
version: 1
title: Unknown pages answer 404 with a page that links home
label: "404"
why: a soft 404 (200 for a page that isn't there) gets junk URLs indexed, a 500 looks like an outage, and a dead end without a link home loses the visitor
applies_to: [website]
category: ops
severity: must
owner_role: engineering
sources:
  - title: 'Google Crawling Infrastructure: How HTTP status codes affect Google''s crawlers (soft 404)'
    url: 'https://developers.google.com/crawling/docs/troubleshooting/http-status-codes'
  - title: 'RFC 9110: HTTP Semantics, 404 Not Found'
    url: 'https://www.rfc-editor.org/rfc/rfc9110.html#status.404'
check:
  kind: script
