id: robots-sitemap
version: 2
title: robots.txt allows crawling and points at a sitemap
label: robots + sitemap
why: crawlers, including AI crawlers, find every page from the sitemap instead of guessing from links; a site-wide Disallow hides the site from search
applies_to: [website]
category: seo
severity: must
owner_role: seo
sources:
  - title: 'RFC 9309: Robots Exclusion Protocol'
    url: 'https://www.rfc-editor.org/rfc/rfc9309.html'
  - title: 'Google Crawling Infrastructure: How Google interprets the robots.txt specification'
    url: 'https://developers.google.com/crawling/docs/robots-txt/robots-txt-spec'
  - title: 'sitemaps.org: Specifying the sitemap location in your robots.txt file'
    url: 'https://www.sitemaps.org/protocol.html#submit_robots'
check:
  kind: http
  requests:
    - path: /robots.txt
      expect:
        - status: 200
        - body: true
          matches: 'sitemap:\s*https?://'
        # `User-agent: *` followed by `Disallow: /` blocks the whole site
        - body: true
          not_matches: 'user-agent:\s*\*\s*disallow:\s*/(\s|$)'
