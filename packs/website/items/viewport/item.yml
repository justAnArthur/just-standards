id: viewport
version: 1
title: The page fits the phone and can be zoomed
label: viewport
why: without width=device-width a phone renders the desktop layout shrunk to fit; user-scalable=no or maximum-scale=1 stops people with low vision from zooming, which WCAG 1.4.4 and the European Accessibility Act require
applies_to: [website, webapp]
category: accessibility
severity: must
owner_role: engineering
sources:
  - title: 'MDN: meta name="viewport"'
    url: 'https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/meta/name/viewport'
  - title: 'W3C: Understanding WCAG 2.2 SC 1.4.4 Resize Text'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html'
check:
  kind: http
  requests:
    - path: /
      expect:
        - select: meta[name="viewport"]
          attr: content
          matches: 'width\s*=\s*device-width'
          # zooming turned off, or capped below 2× (WCAG asks for 200 %)
          not_matches: 'user-scalable\s*=\s*(no|0)\b|maximum-scale\s*=\s*(0*1(\.\d*)?|0*\.\d+|0)\s*($|[,;])'
