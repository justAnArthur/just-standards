id: structured-data
version: 1
title: Structured data (JSON-LD)
label: structured data
why: search engines and AI answers read who is behind the site and what it offers from schema.org data
applies_to: [website]
category: seo
severity: should
owner_role: seo
sources:
  - title: 'Google Search Central: Organization structured data'
    url: 'https://developers.google.com/search/docs/appearance/structured-data/organization'
  - title: 'Google Search Central: Introduction to structured data markup'
    url: 'https://developers.google.com/search/docs/appearance/structured-data/intro-structured-data'
  - title: 'schema.org: Organization'
    url: 'https://schema.org/Organization'
check:
  kind: http
  requests:
    - path: /
      expect:
        - select: script[type="application/ld+json"]
          json: true
          matches: '"@type"\s*:\s*"(Organization|WebSite|Person|SoftwareApplication|Product|LocalBusiness)"'
