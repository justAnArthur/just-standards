id: sitemap-health
version: 1
title: Sitemap URLs answer on the site's own host
label: sitemap health
why: a sitemap full of redirects, 404s or staging hosts wastes crawl budget and gets pages dropped
applies_to: [website]
category: seo
severity: must
owner_role: seo
sources:
  - title: 'Google Search Central: Build and submit a sitemap'
    url: 'https://developers.google.com/search/docs/crawling-indexing/sitemaps/build-sitemap'
  - title: 'sitemaps.org: Sitemaps XML format, sitemap file location'
    url: 'https://www.sitemaps.org/protocol.html#location'
check:
  kind: script
