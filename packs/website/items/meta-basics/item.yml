id: meta-basics
version: 1
title: Title, description, canonical, lang
label: meta basics
why: search results and AI answers quote the title and description; the canonical stops duplicate URLs from splitting ranking
applies_to: [website, webapp]
category: seo
severity: must
owner_role: seo
sources:
  - title: 'Google Search Central: Influencing your title links in search results'
    url: 'https://developers.google.com/search/docs/appearance/title-link'
  - title: 'Google Search Central: Control your snippets in search results, meta descriptions'
    url: 'https://developers.google.com/search/docs/appearance/snippet#meta-descriptions'
  - title: 'Google Search Central: How to specify a canonical URL'
    url: 'https://developers.google.com/search/docs/crawling-indexing/consolidate-duplicate-urls'
check:
  kind: http
  requests:
    - path: /
      expect:
        - select: title
          min_length: 10
          max_length: 70
        - select: meta[name="description"]
          attr: content
          min_length: 50
          max_length: 170
        - select: link[rel="canonical"]
          attr: href
          absolute_url: true
        - select: html
          attr: lang
