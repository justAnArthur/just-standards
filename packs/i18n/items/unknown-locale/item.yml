id: unknown-locale
version: 1
title: A made-up language prefix answers 404
label: unknown locale
why: a route that renders any /xx/ as a page makes endless duplicate pages for crawlers (or a 500 when the translations are missing); it should be a 404
applies_to: [website]
category: i18n
severity: should
owner_role: engineering
sources:
  - title: 'Google Crawling Infrastructure: How HTTP status codes affect Google''s crawlers (soft 404)'
    url: 'https://developers.google.com/crawling/docs/troubleshooting/http-status-codes'
  - title: 'RFC 9110: HTTP Semantics, 404 Not Found'
    url: 'https://www.rfc-editor.org/rfc/rfc9110.html#status.404'
check:
  kind: script
