    url: https://github.com/justAnArthur/payload-www#packages
  - title: payload-plugin-seo README
    url: https://github.com/justAnArthur/payload-www/tree/main/plugins/seo
  - title: payload-imagehash-plugin README
    url: https://github.com/justAnArthur/payload-www/tree/main/plugins/imagehash
applies_when: { dependency: '@justanarthur/payload-www' }
owner_role: engineering
check:
  kind: script
