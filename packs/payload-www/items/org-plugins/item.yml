id: org-plugins
version: 1
title: SEO, image placeholders and translation come from the org plugins
label: Org plugins
why: >-
  the org's SEO plugin generates meta from content, imagehash gives every image a placeholder against layout shift, and
  the translator fills locales; a second SEO plugin next to it writes two meta fields that disagree
