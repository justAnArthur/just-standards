    url: https://payloadcms.com/docs/custom-components/overview
  - title: payload-www integration skill
    url: https://github.com/justAnArthur/payload-www/blob/main/.mavis/skills/payload-www/SKILL.md
applies_when: { dependency: "@justanarthur/payload-www" }
owner_role: engineering
check:
  kind: script
