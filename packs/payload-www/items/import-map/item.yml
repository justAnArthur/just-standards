id: import-map
version: 1
title: Every block render path is in the generated import map
label: Import map
why: >-
  payload-www renders a block through the path in its custom config, looked up in the generated import map; a block added without regenerating it renders nothing on the live site
applies_to: [repo]
category: code
severity: must
