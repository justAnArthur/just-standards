id: media-storage
version: 1
title: Uploads go to object storage, not the server's disk
label: Media storage
why: >-
  a deployment's disk is thrown away on the next deploy (on Vercel it is read-only), so media uploaded by editors vanish or fail; a storage adapter keeps them in object storage (Openinary for org sites) and serves them from there
applies_to: [repo]
category: ops
severity: must
sources:
  - title: Payload docs, Storage Adapters
    url: https://payloadcms.com/docs/upload/storage-adapters
  - title: Vercel docs, Functions limitations (read-only filesystem)
    url: https://vercel.com/docs/functions/limitations
applies_when: { dependency: payload }
owner_role: engineering
check:
  kind: script
