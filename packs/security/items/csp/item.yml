id: csp
version: 1
title: A Content-Security-Policy that holds scripts
label: CSP
why: a CSP that allows only the site's own or nonce-marked scripts turns an injected script (from a CMS field, a compromised tag, a third party) into a blocked request instead of a stolen session or a skimmed card
applies_to: [website, webapp]
category: security
severity: should
owner_role: engineering
sources:
  - title: 'MDN: Content Security Policy (CSP)'
    url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP'
  - title: 'web.dev: Mitigate cross-site scripting (XSS) with a strict Content Security Policy'
    url: 'https://web.dev/articles/strict-csp'
  - title: 'OWASP Content Security Policy Cheat Sheet'
    url: 'https://cheatsheetseries.owasp.org/cheatsheets/Content_Security_Policy_Cheat_Sheet.html'
check:
  kind: script
