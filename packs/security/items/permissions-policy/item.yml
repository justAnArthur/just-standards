id: permissions-policy
version: 1
title: A Permissions-Policy that turns off what the site doesn't use
label: permissions policy
why: it stops an embedded or injected third party from asking for the camera, microphone or location in the site's name
applies_to: [website, webapp]
category: security
severity: nice
owner_role: engineering
sources:
  - title: 'MDN: Permissions-Policy'
    url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Permissions-Policy'
  - title: 'OWASP HTTP Headers Cheat Sheet: Permissions-Policy'
    url: 'https://cheatsheetseries.owasp.org/cheatsheets/HTTP_Headers_Cheat_Sheet.html#permissions-policy-formerly-feature-policy'
check:
  kind: http
  requests:
    - path: /
      expect:
        # at least one feature named with its allow list: camera=(), geolocation=(self)
        - header: permissions-policy
          matches: '[a-z-]+=\('
