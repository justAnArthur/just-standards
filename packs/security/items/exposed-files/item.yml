id: exposed-files
version: 1
title: No source, secrets or server internals are served
label: exposed files
why: a served .git folder hands out the source and its history, a served .env or backup hands out database and API keys; bots probe these paths on every site within hours of launch
applies_to: [website, webapp]
category: security
severity: must
intrusive: true
owner_role: engineering
sources:
  - title: 'OWASP WSTG: Review old backup and unreferenced files for sensitive information'
    url: 'https://wstg.owasp.org/latest/06-Configuration_and_Deployment_Management/03-Review_Old_Backup_and_Unreferenced_Files_for_Sensitive_Information/'
check:
  kind: script
