id: cookie-flags
version: 1
title: Cookies carry Secure and SameSite, sessions HttpOnly
label: cookie flags
why: a cookie without Secure can be read on a hijacked http:// request, one without SameSite rides along on other sites' requests, and a session cookie script can read is what an injected script steals
applies_to: [website, webapp]
category: security
severity: should
owner_role: engineering
sources:
  - title: 'MDN: Set-Cookie header'
    url: 'https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Headers/Set-Cookie'
  - title: 'OWASP Session Management Cheat Sheet: cookies'
    url: 'https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html#cookies'
check:
  kind: script
