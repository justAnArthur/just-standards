id: static-cache
version: 1
title: Hashed assets cached for a year, HTML compressed
label: static cache
why: a returning visitor should download no script or stylesheet twice, and every visitor should get the HTML compressed
applies_to: [website, webapp]
category: performance
severity: should
owner_role: engineering
sources:
  - title: 'web.dev: Prevent unnecessary network requests with the HTTP Cache'
    url: 'https://web.dev/articles/http-cache'
  - title: 'Chrome for Developers (Lighthouse): Serve static assets with an efficient cache policy'
    url: 'https://developer.chrome.com/docs/lighthouse/performance/uses-long-cache-ttl'
  - title: 'Chrome for Developers (Lighthouse): Enable text compression'
    url: 'https://developer.chrome.com/docs/lighthouse/performance/uses-text-compression'
check:
  kind: script
