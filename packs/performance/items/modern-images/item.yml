id: modern-images
version: 1
title: Content images are AVIF or WebP, and not oversized
label: modern images
why: >-
  images are most of a page's bytes; AVIF and WebP are a third to half the size of JPEG and PNG, and an image delivered at
  twice the size it is shown costs four times the pixels
applies_to: [website, webapp]
category: performance
severity: should
owner_role: engineering
sources:
  - title: 'web.dev: Choose the right image format'
    url: 'https://web.dev/articles/choose-the-right-image-format'
  - title: 'Chrome for Developers (Lighthouse): Serve images in modern formats'
    url: 'https://developer.chrome.com/docs/lighthouse/performance/uses-webp-images'
  - title: 'Chrome for Developers (Lighthouse): Properly size images'
    url: 'https://developer.chrome.com/docs/lighthouse/performance/uses-responsive-images'
check:
  kind: browser
  pages: [/]
  viewport: mobile
  script: check.ts
