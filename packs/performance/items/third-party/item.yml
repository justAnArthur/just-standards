id: third-party
version: 1
title: No third-party script or stylesheet blocks the first render
label: 3rd-party blocking
why: >-
  a render-blocking file from another host holds the whole page blank until that host answers; when it is slow or down,
  so is the site
applies_to: [website, webapp]
category: performance
severity: should
owner_role: engineering
sources:
  - title: 'Chrome for Developers (Lighthouse): Eliminate render-blocking resources'
    url: 'https://developer.chrome.com/docs/lighthouse/performance/render-blocking-resources'
  - title: 'web.dev: Loading third-party JavaScript'
    url: 'https://web.dev/articles/optimizing-content-efficiency-loading-third-party-javascript'
check:
  kind: browser
  pages: [/]
  viewport: mobile
  script: check.ts
