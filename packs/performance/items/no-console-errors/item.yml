id: no-console-errors
version: 1
title: No JavaScript errors on the home page and two others
label: console errors
why: >-
  an uncaught exception or a failed resource is a feature that broke silently, such as a form that doesn't send, a gallery that doesn't open, a tag that doesn't fire
applies_to: [website, webapp]
category: performance
severity: should
owner_role: engineering
sources:
  - title: 'Chrome for Developers (Lighthouse): Browser errors were logged to the console'
    url: 'https://developer.chrome.com/docs/lighthouse/best-practices/errors-in-console'
check:
  kind: browser
  pages: [/]
  sample: 2
  viewport: mobile
  expect:
    - console: {}
