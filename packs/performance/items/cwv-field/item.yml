id: cwv-field
version: 1
title: Core Web Vitals pass on mobile
label: Web Vitals
why: Google ranks by them, and a slow, jumpy or laggy page loses visitors before it loads
applies_to: [website, webapp]
category: performance
severity: must
preview: false
owner_role: engineering
sources:
  - title: 'web.dev: Web Vitals'
    url: 'https://web.dev/articles/vitals'
  - title: 'Google Search Central: Understanding Core Web Vitals and Google search results'
    url: 'https://developers.google.com/search/docs/appearance/core-web-vitals'
check:
  kind: psi
  strategy: mobile
  # CrUX p75 over 28 days, "good" thresholds; a site without enough Chrome traffic falls back to the lab run (no INP there)
  field: { lcp_ms: 2500, inp_ms: 200, cls: 0.1 }
