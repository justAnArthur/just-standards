id: axe
version: 1
title: No serious or critical axe-core violations
label: axe
why: >-
  the EAA asks for WCAG 2.1 AA (through EN 301 549); axe-core's serious and critical findings (contrast, missing labels,
  unnamed buttons and links, images without alt) are the barriers that stop a screen-reader or low-vision visitor from booking
applies_to: [website, webapp]
category: accessibility
severity: must
owner_role: engineering
sources:
  - title: 'W3C: Web Content Accessibility Guidelines (WCAG) 2.2'
    url: 'https://www.w3.org/TR/WCAG22/'
  - title: 'axe-core: rule descriptions and their WCAG success criteria'
    url: 'https://raw.githubusercontent.com/dequelabs/axe-core/develop/doc/rule-descriptions.md'
  - title: 'EU Accessibility Act (Directive 2019/882), Annex I: accessibility requirements'
    url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32019L0882#anx_I'
check:
  kind: browser
  pages: [/]
  # and two pages spread across the sitemap: the fleet, a location, the contact page
  sample: 2
  viewport: desktop
  expect:
    - axe: { impact: [serious, critical] }
