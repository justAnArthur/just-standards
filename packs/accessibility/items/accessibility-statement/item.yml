id: accessibility-statement
version: 1
title: An accessibility statement is linked from the home page
label: a11y statement
why: >-
  the EAA (Annex V) and its national laws (Slovakia's 351/2022, Germany's BFSG) ask a service to say how it meets the
  accessibility requirements, against which standard, and how to report a barrier; visitors and regulators look for it in the footer
applies_to: [website, webapp]
category: accessibility
severity: should
owner_role: legal
sources:
  - title: 'EU Accessibility Act (Directive 2019/882), Annex V: information on services meeting the accessibility requirements'
    url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32019L0882#anx_V'
  - title: 'Zákon č. 351/2022 Z. z. o prístupnosti služieb, § 6 Povinnosti poskytovateľa služby'
    url: 'https://static.slov-lex.sk/static/SK/ZZ/2022/351/20260530.html#paragraf-6'
  - title: 'W3C WAI: Developing an Accessibility Statement'
    url: 'https://www.w3.org/WAI/planning/statements/'
check:
  kind: script
