id: reduced-motion
version: 1
title: Nothing moves on load for a visitor who asked for reduced motion
label: reduced motion
why: >-
  visitors with vestibular disorders set "reduce motion" because sliding carousels, parallax and looping animations make
  them dizzy or sick; a site that ignores the setting is unusable for them (WCAG 2.3.3, 2.2.2)
applies_to: [website, webapp]
category: accessibility
severity: nice
owner_role: engineering
sources:
  - title: 'W3C: Understanding WCAG 2.2 SC 2.3.3 Animation from Interactions'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/animation-from-interactions.html'
  - title: 'W3C: Understanding WCAG 2.2 SC 2.2.2 Pause, Stop, Hide'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html'
  - title: 'MDN: prefers-reduced-motion'
    url: 'https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/At-rules/@media/prefers-reduced-motion'
check:
  kind: browser
  pages: [/]
  viewport: mobile
  reduced_motion: true
  script: check.ts
