id: keyboard-nav
version: 1
title: The keyboard reaches the navigation and forms, with visible focus
label: keyboard
why: >-
  many disabled visitors (and power users) never touch a mouse; when Tab skips the menu or the booking form, or focus is
  invisible, they cannot book at all (WCAG 2.1.1, 2.1.2, 2.4.7)
applies_to: [website, webapp]
category: accessibility
severity: must
owner_role: engineering
sources:
  - title: 'W3C: Understanding WCAG 2.2 SC 2.1.1 Keyboard'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html'
  - title: 'W3C: Understanding WCAG 2.2 SC 2.1.2 No Keyboard Trap'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html'
  - title: 'W3C: Understanding WCAG 2.2 SC 2.4.7 Focus Visible'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html'
check:
  kind: browser
  pages: [/]
  viewport: desktop
  keyboard: { tabs: 80 }
  script: check.ts
