id: skip-link
version: 1
title: The first Tab offers a skip link to the content
label: skip link
why: without one, a keyboard or screen-reader visitor tabs through the whole header and menu on every page before reaching the content (WCAG 2.4.1)
applies_to: [website, webapp]
category: accessibility
severity: should
owner_role: engineering
sources:
  - title: 'W3C: Understanding WCAG 2.2 SC 2.4.1 Bypass Blocks'
    url: 'https://www.w3.org/WAI/WCAG22/Understanding/bypass-blocks.html'
  - title: 'W3C WCAG technique G1: adding a link at the top of each page that goes directly to the main content'
    url: 'https://www.w3.org/WAI/WCAG22/Techniques/general/G1'
check:
  kind: browser
  pages: [/]
  viewport: desktop
  keyboard: { tabs: 3 }
  script: check.ts
