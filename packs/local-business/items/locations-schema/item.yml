id: locations-schema
version: 1
title: Every location is a LocalBusiness in JSON-LD
label: locations schema
why: search engines and maps read a branch's address, phone, position and hours from LocalBusiness structured data (AutoRental for car rental); without it, a branch shows up with wrong or missing hours, or not at all
applies_to: [website]
category: seo
severity: must
owner_role: seo
sources:
  - title: 'Google Search Central: Local business structured data, required and recommended properties'
    url: 'https://developers.google.com/search/docs/appearance/structured-data/local-business#structured-data-type-definitions'
  - title: 'schema.org: AutoRental'
    url: 'https://schema.org/AutoRental'
  - title: 'schema.org: LocalBusiness'
    url: 'https://schema.org/LocalBusiness'
check:
  kind: script
