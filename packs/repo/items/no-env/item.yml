id: no-env
version: 2
title: No tracked .env files
label: no .env
why: a committed .env file, anywhere in the repo, leaks secrets to everyone who can read it and stays in the history
applies_to: [repo]
category: security
severity: must
owner_role: engineering
sources:
  - title: 'GitHub Docs: Removing sensitive data from a repository'
    url: 'https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/removing-sensitive-data-from-a-repository'
  - title: 'OWASP Secrets Management Cheat Sheet'
    url: 'https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html'
  - title: 'The Twelve-Factor App: III. Config'
    url: 'https://12factor.net/config'
check:
  kind: repo
  expect:
    - glob: '**/.env{,.*,_*}'
      max: 0
      except: ['**/.env.example', '**/.env.sample', '**/.env.template', '**/.env.*.example', '**/.env.dist']
