id: readme
version: 1
title: README written from the code
label: README
why: the README is the page people and AI tools read first; a thin or boilerplate one hides what the repo does
applies_to: [repo]
category: docs
severity: must
owner_role: engineering
sources:
  - title: 'GitHub Docs: About READMEs'
    url: 'https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/about-readmes'
check:
  kind: github
  expect:
    - field: readme
      min_length: 400
      not_matches: 'bootstrapped with|create-next-app|This template provides a minimal setup|Mintlify Starter Kit'
