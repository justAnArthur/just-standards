id: topics
version: 1
title: 3–8 topics
label: topics
why: topics put the repo in GitHub's topic pages and search filters
applies_to: [repo]
category: docs
severity: nice
owner_role: engineering
sources:
  - title: 'GitHub Docs: Classifying your repository with topics'
    url: 'https://docs.github.com/en/repositories/managing-your-repositorys-settings-and-features/customizing-your-repository/classifying-your-repository-with-topics'
check:
  kind: github
  expect:
    - field: topics
      min_length: 3
      max_length: 8
