id: description
version: 1
title: One-line description
label: description
why: the description is what GitHub search, link previews and profile pages show
applies_to: [repo]
category: docs
severity: should
owner_role: engineering
check:
  kind: github
  expect:
    - field: description
      min_length: 20
      max_length: 100
      not_matches: '\.$'
