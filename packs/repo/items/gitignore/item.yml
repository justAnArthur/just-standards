id: gitignore
version: 1
title: .gitignore
label: ".gitignore"
why: keeps build output, IDE files and local secrets out of the repo
applies_to: [repo]
category: code
severity: should
owner_role: engineering
sources:
  - title: 'Git documentation: gitignore'
    url: 'https://git-scm.com/docs/gitignore'
  - title: 'GitHub Docs: Ignoring files'
    url: 'https://docs.github.com/en/get-started/git-basics/ignoring-files'
check:
  kind: repo
  expect:
    - file: .gitignore
