id: rental-terms
version: 1
title: The rental terms state what a renter must know before booking
label: rental terms
why: minimum age, deposit, insurance excess, fuel, mileage, travel abroad and cancellation decide whether a renter can and will book; a term left unstated becomes a surprise at the counter, a complaint or a lost booking
applies_to: [website]
category: content
severity: must
owner_role: content
sources:
  - title: 'Your Europe: Car rental in the EU'
    url: 'https://europa.eu/youreurope/citizens/travel/driving-abroad/car-rental-abroad/index_en.htm'
  - title: 'Consumer Rights Directive 2011/83/EU (consolidated), Article 6: information requirements'
    url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02011L0083-20260927#art_6'
check:
  kind: script
