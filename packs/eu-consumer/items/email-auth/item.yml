id: email-auth
version: 1
title: SPF and an enforcing DMARC on the domain
label: SPF + DMARC
why: booking confirmations land in the inbox instead of spam, and nobody can send mail as the domain; Gmail and Yahoo reject bulk mail without them
applies_to: [website, webapp]
category: security
severity: must
preview: false
owner_role: engineering
sources:
  - title: 'RFC 7208: Sender Policy Framework (SPF)'
    url: 'https://www.rfc-editor.org/rfc/rfc7208.html'
  - title: 'RFC 7489: Domain-based Message Authentication, Reporting, and Conformance (DMARC)'
    url: 'https://www.rfc-editor.org/rfc/rfc7489.html'
  - title: 'Yahoo Sender Hub: Sender best practices (requirements for bulk senders)'
    url: 'https://senders.yahooinc.com/best-practices/'
check:
  kind: dns
  records:
    - type: TXT
      expect:
        matches: '^v=spf1\b'
        # +all lets anyone send as the domain
        not_matches: '[+]all\b'
    - name: _dmarc
      type: TXT
      expect:
        matches: '^v=DMARC1;(.*;)?\s*p=(quarantine|reject)\b'
