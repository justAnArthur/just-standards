id: consent-mode
version: 1
title: Google tags start with Consent Mode v2 denied
label: consent mode
why: >-
  without Consent Mode v2 defaults of "denied" before any choice, Google tags store and send identifiers before consent,
  and since March 2024 Google Ads stops using conversions and audiences from the EEA that carry no consent signals
applies_to: [website, webapp]
category: privacy
severity: should
owner_role: marketing
sources:
  - title: 'Google Tag Platform: Set up consent mode on websites'
    url: 'https://developers.google.com/tag-platform/security/guides/consent'
  - title: 'Google Tag Platform: Consent mode overview (consent types and how they affect tags)'
    url: 'https://developers.google.com/tag-platform/security/concepts/consent-mode'
  - title: 'Google: EU user consent policy'
    url: 'https://www.google.com/about/company/user-consent-policy/'
check:
  kind: browser
  pages: [/]
  viewport: mobile
  script: check.ts
