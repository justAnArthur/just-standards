id: cookie-consent
version: 1
title: Nothing tracks before consent, and rejecting is one click
label: cookie consent
why: >-
  the ePrivacy Directive and GDPR allow non-essential cookies and trackers only after a free, informed choice; regulators
  (and the EDPB's cookie-banner taskforce) fine sites that track on load or hide "reject" behind a settings screen
applies_to: [website, webapp]
category: privacy
severity: must
owner_role: legal
sources:
  - title: 'ePrivacy Directive 2002/58/EC (consolidated), Article 5(3): consent for storing or reading information on a device'
    url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02002L0058-20091219#art_5'
  - title: 'EDPB: Report of the work undertaken by the Cookie Banner Taskforce'
    url: 'https://www.edpb.europa.eu/documents/task-force-report/report-of-the-work-undertaken-by-the-cookie-banner-taskforce_en'
  - title: 'EDPB: Guidelines 05/2020 on consent under Regulation 2016/679'
    url: 'https://www.edpb.europa.eu/documents/guideline/guidelines-052020-on-consent-under-regulation-2016679_en'
check:
  kind: browser
  pages: [/]
  viewport: mobile
  expect:
    # loaded fresh, with nothing clicked: no request to a known tracker, no tracker or third-party cookie
    - trackers: {}
  # the banner: a reject as easy as accept, and nothing tracks after it is clicked
  script: check.ts
