id: promo-freshness
version: 1
title: No expired offer is shown as current
label: promo freshness
why: an offer that ended, a summer deal in November or a Black Friday from last year costs trust and invites complaints from customers who expect the price; consumer law treats an advertised price as an offer
applies_to: [website]
category: conversion
severity: must
owner_role: marketing
sources:
  - title: 'Unfair Commercial Practices Directive 2005/29/EC (consolidated), Article 6: misleading actions'
    url: 'https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02005L0029-20260927#art_6'
  - title: 'Zákon č. 108/2024 Z. z. o ochrane spotrebiteľa, § 10 Klamlivé konanie'
    url: 'https://static.slov-lex.sk/static/SK/ZZ/2024/108/20260927.html#paragraf-10'
check:
  kind: script
